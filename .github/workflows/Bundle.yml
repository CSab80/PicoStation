name: Construire et vérifier RC5.CS02 PU18 et PU8

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: RC5.CS02 ${{ matrix.board }} sans overclock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [PU18, PU8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les outils de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi clang lld llvm
          git submodule update --init third_party/ucl
          python -m pip install -r requirements-dev.txt
      - name: Reconstruire RC5 et compiler CS02
        run: python tools/rc5/build.py --board ${{ matrix.board }}
      - name: Vérifier les formats de l’éditeur
        run: |
          node tools/test_editor.mjs
          python - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile('build-cs/editor-test-export.zip') as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == {'config.ini', 'background.raw', 'logo.raw'}
              assert len(archive.read('background.raw')) == 77312
              assert len(archive.read('logo.raw')) == 10240
          PYTHON
      - name: Exécuter le code ARM et MIPS en simulation
        run: python tests/firmware.py --board ${{ matrix.board }}
      - name: Compiler et vérifier le diagnostic PU18
        if: matrix.board == 'PU18'
        run: |
          python tools/rc5/build.py --board PU18 --diagnostic-background
          python tests/firmware.py --board PU18 --diagnostic-background
          python tests/background_diagnostic.py --board PU18
      - name: Publier les artefacts de vérification
        uses: actions/upload-artifact@v4
        with:
          name: PicoStation-${{ matrix.board }}-RC5.CS02-experimental
          if-no-files-found: error
          path: |
            build-cs/${{ matrix.board }}/**/*.uf2
            build-cs/${{ matrix.board }}/**/*report.json
            build-cs/${{ matrix.board }}/**/*tests.json
            build-cs/editor-tests.json
